name = "rage-bait-twofifteen"
main = "src/index.js"
compatibility_date = "2026-09-23"
workers_dev = true

[vars]
TWOFIFTEEN_APP_ID = "APP-00063211"
TWOFIFTEEN_BRAND = "Rage Bait Apparel"
TWOFIFTEEN_API_BASE = "https://www.twofifteen.co.uk/api"
ALLOW_LIVE_SUBMISSION = "false"
CHECKOUT_ENABLED = "false"
PAYPAL_MODE = "live"

# Secrets / credentials are deliberately NOT stored in GitHub.
# Add these with `wrangler secret put` or in Cloudflare Dashboard:
#   TWOFIFTEEN_SECRET_KEY
#   FULFILMENT_API_KEY
#   PAYPAL_CLIENT_ID
#   PAYPAL_CLIENT_SECRET
#   RESEND_API_KEY
#
# Checkout stays locked until every live service is ready.
# Safe launch sequence:
#   1. Add LIVE PayPal credentials.
#   2. Apply all D1 migrations.
#   3. Deploy the Worker and confirm /health is healthy.
#   4. Validate the hoodie fulfilment payload separately through /validate.
#   5. Set ALLOW_LIVE_SUBMISSION="true" and deploy.
#   6. Set CHECKOUT_ENABLED="true" and deploy only after the full chain is confirmed.

[[d1_databases]]
binding = "DB"
database_name = "rage-bait-orders"
database_id = "418016d0-659b-4229-b28b-e30e757e047d"
migrations_dir = "migrations"
