name: Fix KingPin Tee internal key

on:
  push:
    paths:
      - '.github/workflows/fix-kingpin-key.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Replace stale KingPin Outlaw key
        run: |
          python - <<'PY'
          from pathlib import Path

          checkout = Path('checkout.js')
          c = checkout.read_text(encoding='utf-8')
          c = c.replace("    'KingPin Outlaw Tee':{slug:'kingpin-outlaw-tee',priceBySize:{S:29.99,M:29.99,L:29.99,XL:29.99,'2XL':29.99,'3XL':29.99,'4XL':29.99}},\n", "")
          c = c.replace("'KingPin Tee':{slug:'kingpin-outlaw-tee'", "'KingPin Tee':{slug:'kingpin-tee'")
          checkout.write_text(c, encoding='utf-8')

          worker = Path('cloudflare/twofifteen-worker/src/index.js')
          w = worker.read_text(encoding='utf-8')
          w = w.replace("  'kingpin-outlaw-tee': {", "  'kingpin-tee': {")
          worker.write_text(w, encoding='utf-8')

          if 'kingpin-outlaw-tee' in checkout.read_text(encoding='utf-8'):
              raise SystemExit('Stale checkout KingPin Outlaw key remains')
          if "'kingpin-outlaw-tee':" in worker.read_text(encoding='utf-8'):
              raise SystemExit('Stale worker KingPin Outlaw key remains')
          PY

      - name: Verify Worker syntax
        run: node --check cloudflare/twofifteen-worker/src/index.js

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checkout.js cloudflare/twofifteen-worker/src/index.js
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Use KingPin Tee product key consistently"
            git push
          fi
