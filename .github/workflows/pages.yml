name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build image assets
        run: |
          mkdir -p assets
          cat assets-src/hero-background.* | base64 -d > assets/hero-background.webp
          cat assets-src/wear-the-troll.* | base64 -d > assets/wear-the-troll.png
          cat assets-src/outlaw-tee.* | base64 -d > assets/outlaw-tee.webp
          cat assets-src/outlaw-front-male-v3.* | base64 -d > assets/outlaw-tee-front-male-v3.webp
          cat assets-src/outlaw-front-female-v3.* | base64 -d > assets/outlaw-tee-front-female-v3.webp
          cat assets-src/outlaw-back-female-v5.* | base64 -d > assets/outlaw-tee-back-female-v5.webp
          cat assets-src/virtual-degenerate-back.0[0-7] | base64 -d > assets/virtual-degenerate-hoodie-back.webp
          cat assets-src/outlaw-hoodie-front-mockup.* | base64 -d > assets/outlaw-hoodie-front.webp
          cat assets-src/outlaw-hoodie-back-mockup.* | base64 -d > assets/outlaw-hoodie-back.webp
          cat assets-src/tees-banner-hero.{01..09}.b64 | base64 -d > assets/tees-banner-hero.webp

          echo "f1c58d6b1a9b28907fe699dc474f0836804789f6be019ae22332263c8e7abe21  assets/outlaw-tee-front-male-v3.webp" | sha256sum -c -
          echo "362a63518a77c8e1ef5351e7abe74ad09dfbae82ef59d1160c9cece9b47a3891  assets/outlaw-tee-front-female-v3.webp" | sha256sum -c -
          echo "2e92f8d54b05d97fca7015344f8552efe52b456fc404fbe44ba60147dac872a2  assets/outlaw-tee-back-female-v5.webp" | sha256sum -c -
          echo "26e755a83c4d9a43904cb11c7ccf569232489d50b9b154965d8cad9427110474  assets/virtual-degenerate-hoodie-back.webp" | sha256sum -c -
          echo "21471d7623cb274ed273d148ad8a89f1b2405c9968d7f336ca08312762afb63f  assets/outlaw-hoodie-front.webp" | sha256sum -c -
          echo "04ad0de154d288a2caedd0652f0c6f237653ac4dbb01d269d19177df9c43727b  assets/outlaw-hoodie-back.webp" | sha256sum -c -
          test "$(stat -c%s assets/outlaw-tee-back-female-v5.webp)" -eq 21170
          test -s assets/tees-banner-hero.webp
          echo "Verified gallery image assets"

      - name: Verify Two Fifteen print masters
        run: |
          test -s print/outlaw-front.png
          test -s print/outlaw-back.png
          test -s print/outlaw-hood-front.png
          test -s print/virtual-degenerate-front.png
          test -s print/virtual-degenerate-tee-front.png
          test -s print/virtual-degenerate-back.png
          echo "Verified uploaded Two Fifteen print masters"

      - name: Bust static asset caches
        env:
          SITE_VERSION: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          version = os.environ["SITE_VERSION"][:12]
          html_asset = re.compile(r'(?P<prefix>(?:href|src)=["\'])(?P<path>(?!https?:|//|mailto:|#)[^"\']+\.(?:css|js|png|jpe?g|webp|svg))(?P<query>\?[^"\']*)?(?P<suffix>["\'])', re.IGNORECASE)
          css_asset = re.compile(r'(?P<prefix>url\(["\']?)(?P<path>(?!https?:|//|data:)[^)"\']+\.(?:png|jpe?g|webp|svg))(?P<query>\?[^)"\']*)?(?P<suffix>["\']?\))', re.IGNORECASE)

          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              text = html_asset.sub(lambda m: f'{m.group("prefix")}{m.group("path")}?v={version}{m.group("suffix")}', text)
              path.write_text(text, encoding='utf-8')

          for path in Path('.').rglob('*.css'):
              text = path.read_text(encoding='utf-8')
              text = css_asset.sub(lambda m: f'{m.group("prefix")}{m.group("path")}?v={version}{m.group("suffix")}', text)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
