name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build image assets
        run: |
          mkdir -p assets
          cat assets-src/hero-background.* | base64 -d > assets/hero-background.webp
          cat assets-src/wear-the-troll.* | base64 -d > assets/wear-the-troll.png
          cat assets-src/outlaw-tee.* | base64 -d > assets/outlaw-tee.webp

      - name: Build Two Fifteen print masters
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          target = (3780, 5906)  # 320 x 500 mm at 300 DPI
          out = Path('print')
          out.mkdir(exist_ok=True)

          # Front master: full Minorz Outlaw artwork.
          front = Image.open('assets/neon_outlaw_hyena_sticker_art.png').convert('RGBA')
          front = front.resize(target, Image.Resampling.LANCZOS)
          front.save(out / 'outlaw-front.png', 'PNG', dpi=(300, 300), compress_level=6)

          # Rear master: Rage Bait logo placed high on the 320 x 500 mm transparent canvas.
          logo = Image.open('assets/logo-rage-bait.png').convert('RGBA')
          canvas = Image.new('RGBA', target, (0, 0, 0, 0))
          logo_target_w = 560
          logo_target_h = round(logo.height * (logo_target_w / logo.width))
          logo = logo.resize((logo_target_w, logo_target_h), Image.Resampling.LANCZOS)
          x = (target[0] - logo_target_w) // 2
          y = 20
          canvas.alpha_composite(logo, (x, y))
          canvas.save(out / 'outlaw-back.png', 'PNG', dpi=(300, 300), compress_level=6)

          print('Built print/outlaw-front.png and print/outlaw-back.png')
          PY

      - name: Bust static asset caches
        env:
          SITE_VERSION: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          version = os.environ["SITE_VERSION"][:12]

          html_asset = re.compile(
              r'(?P<prefix>(?:href|src)=["\'])(?P<path>(?!https?:|//|mailto:|#)[^"\']+\.(?:css|js|png|jpe?g|webp|svg))(?P<query>\?[^"\']*)?(?P<suffix>["\'])',
              re.IGNORECASE,
          )

          css_asset = re.compile(
              r'(?P<prefix>url\(["\']?)(?P<path>(?!https?:|//|data:)[^)"\']+\.(?:png|jpe?g|webp|svg))(?P<query>\?[^)"\']*)?(?P<suffix>["\']?\))',
              re.IGNORECASE,
          )

          for path in Path(".").rglob("*.html"):
              text = path.read_text(encoding="utf-8")
              text = html_asset.sub(
                  lambda m: f'{m.group("prefix")}{m.group("path")}?v={version}{m.group("suffix")}',
                  text,
              )
              path.write_text(text, encoding="utf-8")

          for path in Path(".").rglob("*.css"):
              text = path.read_text(encoding="utf-8")
              text = css_asset.sub(
                  lambda m: f'{m.group("prefix")}{m.group("path")}?v={version}{m.group("suffix")}',
                  text,
              )
              path.write_text(text, encoding="utf-8")

          print(f"Static asset cache version: {version}")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
