name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build image assets
        run: |
          mkdir -p assets
          cat assets-src/hero-background.* | base64 -d > assets/hero-background.webp
          cat assets-src/wear-the-troll.* | base64 -d > assets/wear-the-troll.png
          cat assets-src/outlaw-tee.* | base64 -d > assets/outlaw-tee.webp
          cat assets-src/outlaw-front-male-v3.* | base64 -d > assets/outlaw-tee-front-male-v3.webp
          cat assets-src/outlaw-front-female-v3.* | base64 -d > assets/outlaw-tee-front-female-v3.webp
          cat assets-src/outlaw-back-female-v5.* | base64 -d > assets/outlaw-tee-back-female-v5.webp
          cat assets-src/virtual-degenerate-back.* | base64 -d > assets/virtual-degenerate-hoodie-back.webp

          echo "f1c58d6b1a9b28907fe699dc474f0836804789f6be019ae22332263c8e7abe21  assets/outlaw-tee-front-male-v3.webp" | sha256sum -c -
          echo "362a63518a77c8e1ef5351e7abe74ad09dfbae82ef59d1160c9cece9b47a3891  assets/outlaw-tee-front-female-v3.webp" | sha256sum -c -
          echo "2e92f8d54b05d97fca7015344f8552efe52b456fc404fbe44ba60147dac872a2  assets/outlaw-tee-back-female-v5.webp" | sha256sum -c -
          test "$(stat -c%s assets/outlaw-tee-back-female-v5.webp)" -eq 21170
          echo "Verified Outlaw Tee gallery image assets"

      - name: Build Two Fifteen print masters
        run: |
          python -m pip install --quiet pillow
          mkdir -p print print-src/.work
          base64 -d print-src/outlaw-back-logo.b64 > print-src/.work/outlaw-back-logo.png
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          target = (3780, 5906)
          out = Path('print')
          out.mkdir(exist_ok=True)

          front = Image.open('assets/neon_outlaw_hyena_sticker_art.png').convert('RGBA')
          front = front.resize(target, Image.Resampling.LANCZOS)
          front.save(out / 'outlaw-front.png', 'PNG', dpi=(300, 300), compress_level=6)

          logo = Image.open('print-src/.work/outlaw-back-logo.png').convert('RGBA')
          logo = logo.resize((548, 436), Image.Resampling.LANCZOS)
          canvas = Image.new('RGBA', target, (0, 0, 0, 0))
          canvas.alpha_composite(logo, (1622, 0))
          canvas.save(out / 'outlaw-back.png', 'PNG', dpi=(300, 300), compress_level=6)
          PY

      - name: Bust static asset caches
        env:
          SITE_VERSION: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          version = os.environ["SITE_VERSION"][:12]
          html_asset = re.compile(r'(?P<prefix>(?:href|src)=["\'])(?P<path>(?!https?:|//|mailto:|#)[^"\']+\.(?:css|js|png|jpe?g|webp|svg))(?P<query>\?[^"\']*)?(?P<suffix>["\'])', re.IGNORECASE)
          css_asset = re.compile(r'(?P<prefix>url\(["\']?)(?P<path>(?!https?:|//|data:)[^)"\']+\.(?:png|jpe?g|webp|svg))(?P<query>\?[^)"\']*)?(?P<suffix>["\']?\))', re.IGNORECASE)

          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              text = html_asset.sub(lambda m: f'{m.group("prefix")}{m.group("path")}?v={version}{m.group("suffix")}', text)
              path.write_text(text, encoding='utf-8')

          for path in Path('.').rglob('*.css'):
              text = path.read_text(encoding='utf-8')
              text = css_asset.sub(lambda m: f'{m.group("prefix")}{m.group("path")}?v={version}{m.group("suffix")}', text)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
