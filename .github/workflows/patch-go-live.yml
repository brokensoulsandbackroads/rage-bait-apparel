name: Patch go-live product mappings

on:
  push:
    paths:
      - '.github/workflows/patch-go-live.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Patch checkout and fulfilment mappings
        env:
          THERAPY_B64: 
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, base64

          worker = Path('cloudflare/twofifteen-worker/src/index.js')
          text = worker.read_text(encoding='utf-8')
          text = text.replace("title:'KingPin Outlaw Tee', colour:'Olive'", "title:'KingPin Tee', colour:'Olive'")
          if "'therapy-was-expensive-tee':" not in text:
              marker = "  'rage-bait-keyring': {\n"
              if marker not in text:
                  raise SystemExit('Worker insertion marker not found')
              therapy = base64.b64decode(os.environ['THERAPY_B64']).decode('utf-8')
              text = text.replace(marker, therapy + marker, 1)
          assert "'therapy-was-expensive-tee':" in text
          assert "'therapy-was-expensive-hoodie':" in text
          worker.write_text(text, encoding='utf-8')

          checkout = Path('checkout.js')
          c = checkout.read_text(encoding='utf-8')
          old = "    'KingPin Outlaw Tee':{slug:'kingpin-outlaw-tee',priceBySize:{S:29.99,M:29.99,L:29.99,XL:29.99,'2XL':29.99,'3XL':29.99,'4XL':29.99}},\n"
          alias = old + "    'KingPin Tee':{slug:'kingpin-outlaw-tee',priceBySize:{S:29.99,M:29.99,L:29.99,XL:29.99,'2XL':29.99,'3XL':29.99,'4XL':29.99}},\n"
          if "'KingPin Tee':{slug:'kingpin-outlaw-tee'" not in c:
              if old not in c:
                  raise SystemExit('KingPin checkout mapping marker not found')
              c = c.replace(old, alias, 1)
          assert "'KingPin Tee':{slug:'kingpin-outlaw-tee'" in c
          checkout.write_text(c, encoding='utf-8')

          for filename in ['fulfilment/therapy-was-expensive-tee.json','fulfilment/therapy-was-expensive-hoodie.json']:
              p = Path(filename)
              s = p.read_text(encoding='utf-8').replace('DTG Printing Front Side','Printing Front Side').replace('DTG Printing Back Side','Printing Back Side')
              p.write_text(s, encoding='utf-8')
          PY

      - name: Verify worker syntax
        run: node --check cloudflare/twofifteen-worker/src/index.js

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checkout.js cloudflare/twofifteen-worker/src/index.js fulfilment/therapy-was-expensive-tee.json fulfilment/therapy-was-expensive-hoodie.json
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Complete go-live product mappings"
            git push
          fi
